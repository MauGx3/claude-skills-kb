name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    # macOS runs because install.sh must work with BSD tools (see the sed -i regression test).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Generated docs are up to date
        run: |
          python scripts/render_docs.py
          # porcelain also catches new untracked files, which git diff ignores
          out="$(git status --porcelain -- docs AGENTS.md desktop)"
          if [ -n "$out" ]; then echo "$out"; git diff -- docs AGENTS.md desktop; exit 1; fi
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh
